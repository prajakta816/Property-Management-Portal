<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Dashboard | Realty Deal & Commission Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
        <a class="navbar-brand fw-bold" href="#">Realty Manager</a>
        <div class="ms-auto d-flex align-items-center gap-3">
            <span class="text-white small" id="currentUserDisplay">Logged in as Agent</span>
            <button class="btn btn-outline-light btn-sm" id="logoutBtn">Logout</button>
        </div>
    </nav>

    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h3 fw-bold mb-1">Agent Dashboard</h1>
                <p class="text-muted mb-0">Available properties, deals and buyers</p>
            </div>
        </div>

        <div class="alert alert-success">
            <strong>Login Successful!</strong> You have successfully signed in as <strong>Agent</strong>.
        </div>
    </div>

    <script type="module">
        import { getCurrentUser, clearCurrentUser } from "./dist/user.js";
        const user = getCurrentUser();
        if (user) {
            const display = document.getElementById("currentUserDisplay");
            if (display) display.textContent = `${user.name} (${user.role})`;
        }
        document.getElementById("logoutBtn")?.addEventListener("click", () => {
            clearCurrentUser();
            window.location.href = "login.html";
        });
    </script>
</body>
</html>
