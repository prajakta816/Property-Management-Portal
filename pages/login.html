
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Realty Deal & Commission Manager</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../styles/login.css">
</head>

<body>
    <main class="login-page">
        <div class="card border-0 login-card">
            <div class="text-center mb-4">
                <h1 class="login-heading"> Realty Deal </h1>
                <p class="login-subtitle mb-1"> & Commission Manager </p>
                <h2 class="h5 mt-4"> Welcome Back </h2>
            </div>

            <form id="loginForm" novalidate autocomplete="off">
                <div class="mb-3">
                    <label for="emailInput" class="form-label" > Email Address </label>
                    <input type="email" class="form-control" id="emailInput" name="email" placeholder="Enter your email" required autocomplete="off">
                    <div id="emailErrorMessage" class="invalid-feedback" ></div>
                </div>

                <div class="mb-3">
                    <label for="passwordInput" class="form-label">Password</label>
                    <div class="input-group has-validation">
                        <input type="password" class="form-control" id="passwordInput" name="password" placeholder="Enter your password" required autocomplete="new-password">
                        <!-- <button class="btn btn-outline-secondary" type="button" id="togglePasswordBtn" aria-label="Show password">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8M1.173 8a13 13 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5s3.879 1.168 5.168 2.457A13 13 0 0 1 14.828 8q-.086.13-.195.288c-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5s-3.879-1.168-5.168-2.457A13 13 0 0 1 1.172 8z"/><path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5M4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0"/></svg>
                        </button> -->
                        <div id="passwordErrorMessage" class="invalid-feedback"></div>
                    </div>
                </div>

                <div id="loginErrorMessage" class="alert alert-danger d-none" role="alert" ></div>
                <button type="submit" class="btn btn-primary w-100" id="loginButton"> Login </button>
            </form>

            <p class="text-center text-muted small mt-4 mb-0">
                Please contact your administrator if you
                need an account.
            </p>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" ></script>
    <script type="module" src="../dist/login.js"></script>

</body>
</html>
