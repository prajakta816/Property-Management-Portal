<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Realty Deal & Commission Manager</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../styles/login.css">
    <link rel="stylesheet" href="../styles/loader.css">
</head>

<body>

    <main class="login-page">
        <div class="card border-0 login-card">
            <div class="text-center mb-4">
                <h1 class="login-heading"> Realty Deal </h1>
                <p class="login-subtitle mb-1"> & Commission Manager </p>
                <h2 class="h5 mt-4"> Welcome Back </h2>
            </div>

            <form id="loginForm" novalidate autocomplete="off">
                <div class="mb-3">
                    <label for="emailInput" class="form-label" > Email Address </label>
                    <input type="email" class="form-control" id="emailInput" name="email" placeholder="Enter your email" required autocomplete="off">
                    <div id="emailErrorMessage" class="invalid-feedback" ></div>
                </div>

                <div class="mb-3">
                    <label for="passwordInput" class="form-label">Password</label>

                    <!-- Custom password wrapper so the eye button stays inside the input. -->
                    <div class="password-input-wrapper">
                        <input type="password" class="form-control" id="passwordInput" name="password" placeholder="Enter your password" required autocomplete="new-password">

                        <!-- This button lets the user show or hide the password. -->
                        <button type="button" id="togglePasswordButton" class="password-toggle" aria-label="Show password">
                            <svg id="passwordEyeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24">
                                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" stroke="currentColor" stroke-width="2"/>
                                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
                                <path id="passwordEyeSlash" d="M4 4l16 16" stroke="currentColor" stroke-width="2"/>
                            </svg>
                        </button>

                        <div id="passwordErrorMessage" class="invalid-feedback"></div>
                    </div>
                </div>

                <div id="loginErrorMessage" class="alert alert-danger d-none" role="alert"></div>

                <!-- The loader is kept beside the button and appears only while login is processing. -->
                <div class="d-flex align-items-center gap-2">
                    <button type="submit" class="btn btn-primary flex-grow-1" id="loginButton"> Login </button>

                    <div id="loader">
                        <div class="spinner"></div>
                    </div>
                </div>
            </form>

            <p class="text-center text-muted small mt-4 mb-0">
                Please contact your administrator if you
                need an account.
            </p>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" ></script>
    <script type="module" src="../dist/login.js"></script>

</body>
</html>
