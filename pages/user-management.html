<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management | Realty Deal & Commission Manager</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../styles/dashboard.css">
    <link rel="stylesheet" href="../styles/user-management.css">
</head>

<body>
    <div class="dashboard-layout">
        <aside id="sidebar" class="dashboard-sidebar"></aside>

        <main class="dashboard-main">
            <header class="top-navbar">
                <div class="nav-left">
                    <button type="button" class="mobile-toggle-btn" id="sidebarMobileToggle" aria-label="Open sidebar menu">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    </button>
                    <span class="fw-bold text-secondary">Admin Portal</span>
                </div>

                <div class="d-flex align-items-center gap-3">
                    <span class="user-badge" id="currentUserDisplay">Admin</span>
                    <button type="button" class="btn btn-outline-danger btn-sm" id="logoutButton">Logout</button>
                </div>
            </header>

            <div class="content-container">
                <div class="page-header">
                    <div>
                        <h1>User Management</h1>
                        <p class="text-muted">Manage agents and commission managers.</p>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="button" id="addUserButton" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#userModal">
                            + Add User
                        </button>
                    </div>
                </div>

                <div class="row g-4 mb-4">
                    <div class="col-md-4">
                        <div class="summary-card">
                            <span>Total Users</span>
                            <strong id="totalUsers">0</strong>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="summary-card">
                            <span>Agents</span>
                            <strong id="totalAgents">0</strong>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="summary-card">
                            <span>Commission Managers</span>
                            <strong id="totalManagers">0</strong>
                        </div>
                    </div>
                </div>

                <section class="users-card">
                    <div class="users-header">
                        <div>
                            <h2>Users</h2>
                            <p>View and manage system users.</p>
                        </div>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <input type="text" id="searchUser" class="form-control" placeholder="Search by name or email">
                        </div>

                        <div class="col-md-3">
                            <select id="roleFilter" class="form-select">
                                <option value="">All Roles</option>
                                <option value="agent">Agent</option>
                                <option value="commission-manager">Commission Manager</option>
                            </select>
                        </div>

                        <div class="col-md-3">
                            <select id="genderFilter" class="form-select">
                                <option value="">All Gender</option>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                                <option value="other">Other</option>
                                <option value="prefer-not-to-say">Prefer not to say</option>
                            </select>
                        </div>
                    </div>

                    <div class="table-responsive">
                        <table class="table align-middle mb-0">
                            <thead>
                                <tr>
                                    <th class="text-center">Actions</th>
                                    <th>Name</th>
                                    <th>Email</th>
                                    <th>Role</th>
                                </tr>
                            </thead>

                            <tbody id="usersTableBody"></tbody>
                        </table>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- Add/Edit User Modal -->
    <div class="modal fade" id="userModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <div>
                        <h2 class="modal-title fs-4" id="userModalTitle">Add User</h2>
                        <p class="text-secondary mb-0">Enter user details.</p>
                    </div>

                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <form id="userForm" novalidate>
                        <div class="mb-3">
                            <label for="name" class="form-label">Name</label>
                            <input type="text" id="name" class="form-control" placeholder="Enter full name">
                            <div id="nameError" class="invalid-feedback"></div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" id="email" class="form-control" placeholder="name@example.com">
                            <div id="emailError" class="invalid-feedback"></div>
                        </div>

                        <!-- Password is handled by our own Show/Hide button. -->
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>

                            <div class="password-field">
                                <input type="password" id="password" class="form-control password-input" placeholder="Enter password" autocomplete="new-password">
                                <button type="button" id="togglePasswordButton" class="password-toggle" aria-label="Show password">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>

                            <div id="passwordError" class="invalid-feedback"></div>
                        </div>

                        <!-- Confirm password is required when adding or changing a password. -->
                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label">Confirm Password</label>

                            <div class="password-field">
                                <input type="password" id="confirmPassword" class="form-control password-input" placeholder="Confirm password" autocomplete="new-password">
                                <button type="button" id="toggleConfirmPasswordButton" class="password-toggle" aria-label="Show confirm password">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>

                            <div id="confirmPasswordError" class="invalid-feedback"></div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="gender" class="form-label">Gender</label>

                                <div class="role-wrapper">
                                    <select id="gender" class="form-select">
                                        <option value="">Select Gender</option>
                                        <option value="male">Male</option>
                                        <option value="female">Female</option>
                                        <option value="other">Other</option>
                                        <option value="prefer-not-to-say">Prefer not to say</option>
                                    </select>

                                    <button type="button" id="clearGenderButton" class="clear-role">×</button>
                                </div>

                                <div id="genderError" class="invalid-feedback"></div>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="role" class="form-label">Role</label>

                                <div class="role-wrapper">
                                    <select id="role" class="form-select">
                                        <option value="">Select Role</option>
                                        <option value="agent">Agent</option>
                                        <option value="commission-manager">Commission Manager</option>
                                    </select>

                                    <button type="button" id="clearRoleButton" class="clear-role">×</button>
                                </div>

                                <div id="roleError" class="invalid-feedback"></div>
                            </div>
                        </div>
                    </form>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-light border" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" form="userForm" id="saveUserButton" class="btn btn-primary">Save User</button>
                </div>
            </div>
        </div>
    </div>

    <!-- View User Modal -->
    <div class="modal fade" id="viewUserModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-md modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <div>
                        <h2 class="modal-title fs-4">User Details</h2>
                        <p class="text-secondary mb-0">View user information.</p>
                    </div>

                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <div class="user-detail">
                        <span>Name</span>
                        <strong id="viewUserName">-</strong>
                    </div>

                    <div class="user-detail">
                        <span>Email</span>
                        <strong id="viewUserEmail">-</strong>
                    </div>

                    <div class="user-detail">
                        <span>Gender</span>
                        <strong id="viewUserGender">-</strong>
                    </div>

                    <div class="user-detail">
                        <span>Role</span>
                        <strong id="viewUserRole">-</strong>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-light border" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../dist/user-management.js"></script>
</body>

</html>
